<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <circle cx="96" cy="96" r="96" fill="url(#gradient1)"/>
  
  <!-- Checkmark Circle (Completion Symbol) -->
  <circle cx="96" cy="96" r="68" fill="white" opacity="0.15"/>
  <circle cx="96" cy="96" r="58" fill="white" opacity="0.2"/>
  
  <!-- Main Checkmark -->
  <path d="M70 96L86 112L122 76" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Circular Progress Indicator (3/4 circle) -->
  <path d="M96 28 A68 68 0 1 1 28 96" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.4" fill="none"/>
  
  <!-- Streak Flame Icon (top right) -->
  <g transform="translate(130, 40)">
    <path d="M0 20C0 20 -8 12 -8 6C-8 0 -4 -4 0 -4C4 -4 8 0 8 6C8 12 0 20 0 20Z" fill="#FFD700" opacity="0.9"/>
    <path d="M0 16C0 16 -5 10 -5 6C-5 2 -2 0 0 0C2 0 5 2 5 6C5 10 0 16 0 16Z" fill="#FFF" opacity="0.8"/>
  </g>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
