<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%" fill="none" role="img" aria-label="Mockup: Routine Manager &amp; Habits Screen">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 19px; fill: #0F172A; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #0F172A; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #64748B; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10px; }
    </style>
  </defs>

  <rect width="800" height="850" fill="#F8FAFC" />

  <!-- Top Navigation -->
  <g transform="translate(0, 0)">
    <rect width="800" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <g transform="translate(0, 4) scale(0.22)">
        <path d="M 68 132 C 44 132 40 100 68 84 C 92 70 108 130 132 116 C 160 100 156 68 132 68 C 108 68 92 128 68 132 Z" stroke="#0F766E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="100" cy="100" r="11" fill="#D97706" />
      </g>
      <text x="46" y="22" class="header-title">Routine Architecture</text>
      <text x="46" y="36" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748B">Life Areas, Frequencies &amp; Completion Modes</text>

      <!-- Add New Routine Button -->
      <rect x="470" y="4" width="130" height="34" rx="10" fill="#0F766E" />
      <text x="535" y="25" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">+ New Routine</text>
    </g>
  </g>

  <!-- Content Column -->
  <g transform="translate(100, 96)">

    <!-- Philosophy Banner -->
    <rect width="600" height="60" rx="14" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1.5" />
    <text x="20" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#0F766E">Humane Scheduling Philosophy</text>
    <text x="20" y="44" class="meta-text" fill="#115E59">Preferred times represent natural cadence windows, not rigid clock deadlines. Sunday rest is protected.</text>

    <!-- Routine 1: Practice English Workbook -->
    <g transform="translate(0, 80)">
      <rect width="600" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="18" y="16" width="116" height="20" rx="10" fill="#EFF6FF" />
      <text x="76" y="30" class="badge-text" fill="#1D4ED8" text-anchor="middle">English Learning</text>

      <rect x="140" y="16" width="76" height="20" rx="10" fill="#F1F5F9" />
      <text x="178" y="30" class="badge-text" fill="#475569" text-anchor="middle">Anytime</text>

      <rect x="222" y="16" width="94" height="20" rx="10" fill="#F1F5F9" />
      <text x="269" y="30" class="badge-text" fill="#475569" text-anchor="middle">2-Session Target</text>

      <text x="18" y="60" class="card-title">Practice English Workbook</text>
      <text x="240" y="60" class="meta-text">Norman Lewis • Daily revision requirement</text>

      <!-- Edit / Action Controls -->
      <rect x="520" y="26" width="60" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="550" y="46" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#0F172A" text-anchor="middle">Edit</text>
    </g>

    <!-- Routine 2: Exercise Plan -->
    <g transform="translate(0, 178)">
      <rect width="600" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="18" y="16" width="138" height="20" rx="10" fill="#CCFBF1" />
      <text x="87" y="30" class="badge-text" fill="#0F766E" text-anchor="middle">Movement &amp; Strength</text>

      <rect x="162" y="16" width="86" height="20" rx="10" fill="#F1F5F9" />
      <text x="205" y="30" class="badge-text" fill="#475569" text-anchor="middle">Afternoon</text>

      <rect x="254" y="16" width="112" height="20" rx="10" fill="#FEF3C7" />
      <text x="310" y="30" class="badge-text" fill="#B45309" text-anchor="middle">12-Week Progressive</text>

      <text x="18" y="60" class="card-title">Body Restoration Protocol</text>
      <text x="236" y="60" class="meta-text">M/W/F Workout • T/Th/S Walk &amp; Stretch • Sun Rest</text>

      <rect x="520" y="26" width="60" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="550" y="46" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#0F172A" text-anchor="middle">Edit</text>
    </g>

    <!-- Routine 3: Listen to Osho -->
    <g transform="translate(0, 276)">
      <rect width="600" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="18" y="16" width="136" height="20" rx="10" fill="#FEF3C7" />
      <text x="86" y="30" class="badge-text" fill="#B45309" text-anchor="middle">Listening &amp; Awareness</text>

      <rect x="160" y="16" width="76" height="20" rx="10" fill="#F1F5F9" />
      <text x="198" y="30" class="badge-text" fill="#475569" text-anchor="middle">Anytime</text>

      <rect x="242" y="16" width="110" height="20" rx="10" fill="#F1F5F9" />
      <text x="297" y="30" class="badge-text" fill="#475569" text-anchor="middle">30-Discourse Catalog</text>

      <text x="18" y="60" class="card-title">Listen to Osho</text>
      <text x="146" y="60" class="meta-text">Flexible learning path across 6 thematic groups</text>

      <rect x="520" y="26" width="60" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="550" y="46" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#0F172A" text-anchor="middle">Edit</text>
    </g>

    <!-- Routine 4: Read Books -->
    <g transform="translate(0, 374)">
      <rect width="600" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="18" y="16" width="94" height="20" rx="10" fill="#EEF2FF" />
      <text x="65" y="30" class="badge-text" fill="#4338CA" text-anchor="middle">Night Reading</text>

      <rect x="118" y="16" width="86" height="20" rx="10" fill="#F1F5F9" />
      <text x="161" y="30" class="badge-text" fill="#475569" text-anchor="middle">Before Bed</text>

      <rect x="210" y="16" width="76" height="20" rx="10" fill="#F1F5F9" />
      <text x="248" y="30" class="badge-text" fill="#475569" text-anchor="middle">30 Minutes</text>

      <text x="18" y="60" class="card-title">Read Books</text>
      <text x="120" y="60" class="meta-text">Target 30 minutes before sleep • Relaxing focus</text>

      <rect x="520" y="26" width="60" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="550" y="46" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#0F172A" text-anchor="middle">Edit</text>
    </g>

    <!-- Routine 5: Diary -->
    <g transform="translate(0, 472)">
      <rect width="600" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="18" y="16" width="112" height="20" rx="10" fill="#FFE4E6" />
      <text x="74" y="30" class="badge-text" fill="#BE123C" text-anchor="middle">Private Reflection</text>

      <rect x="136" y="16" width="76" height="20" rx="10" fill="#F1F5F9" />
      <text x="174" y="30" class="badge-text" fill="#475569" text-anchor="middle">Anytime</text>

      <rect x="218" y="16" width="116" height="20" rx="10" fill="#F1F5F9" />
      <text x="276" y="30" class="badge-text" fill="#475569" text-anchor="middle">Structured Prompts</text>

      <text x="18" y="60" class="card-title">Maintain a Diary</text>
      <text x="156" y="60" class="meta-text">Self-inquiry: What happened? What did I feel? What did I learn?</text>

      <rect x="520" y="26" width="60" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="550" y="46" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#0F172A" text-anchor="middle">Edit</text>
    </g>

    <!-- Routine 6: Spoken English -->
    <g transform="translate(0, 570)">
      <rect width="600" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="18" y="16" width="108" height="20" rx="10" fill="#E0F2FE" />
      <text x="72" y="30" class="badge-text" fill="#0284C7" text-anchor="middle">Communication</text>

      <rect x="132" y="16" width="76" height="20" rx="10" fill="#F1F5F9" />
      <text x="170" y="30" class="badge-text" fill="#475569" text-anchor="middle">Anytime</text>

      <text x="18" y="60" class="card-title">Practice English Speaking</text>
      <text x="220" y="60" class="meta-text">Conversational speaking practice with ChatGPT</text>

      <rect x="520" y="26" width="60" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="550" y="46" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#0F172A" text-anchor="middle">Edit</text>
    </g>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 786)">
    <rect width="800" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(250, 12)">
      <text x="40" y="25" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B" text-anchor="middle">Today</text>
      
      <!-- Routine Active -->
      <rect x="110" y="0" width="80" height="40" rx="12" fill="#CCFBF1" />
      <text x="150" y="25" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#0F766E" text-anchor="middle">Routine</text>

      <text x="260" y="25" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B" text-anchor="middle">Insights</text>
    </g>
  </g>
</svg>
