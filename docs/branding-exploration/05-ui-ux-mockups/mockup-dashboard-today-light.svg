<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" fill="none" role="img" aria-label="Mockup: Today Dashboard (Light Mode)">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; fill: #0F172A; }
      .text-xs { font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-sm { font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-base { font-size: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #0F172A; }
      .text-muted { fill: #64748B; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; }
      .period-title { font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #475569; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1100" fill="#F8FAFC" />

  <!-- TopNav Header Bar (Sticky Container) -->
  <g transform="translate(0, 0)">
    <rect width="800" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(100, 16)">
      <!-- Approved Logo: Guiding Sutra Lockup -->
      <g transform="translate(0, 4) scale(0.22)">
        <path d="M 68 132 C 44 132 40 100 68 84 C 92 70 108 130 132 116 C 160 100 156 68 132 68 C 108 68 92 128 68 132 Z" stroke="#0F766E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="100" cy="100" r="11" fill="#D97706" />
      </g>
      <text x="46" y="22" class="header-title">Vritta</text>
      <text x="46" y="36" class="text-xs" fill="#64748B" font-weight="500">Wednesday, 14 October 2026</text>

      <!-- Theme Mode Pill (Light / Dark / System) -->
      <g transform="translate(440, 4)">
        <rect width="84" height="32" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <!-- Sun icon (Active Light) -->
        <circle cx="20" cy="16" r="6" fill="#0F766E" />
        <!-- Moon icon -->
        <path d="M 44 12 A 6 6 0 0 0 50 18 A 6 6 0 1 1 44 12" fill="#94A3B8" />
        <!-- Auto / System icon -->
        <circle cx="68" cy="16" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      </g>

      <!-- User Avatar -->
      <g transform="translate(540, 4)">
        <rect width="32" height="32" rx="16" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5" />
        <text x="16" y="21" class="text-xs" font-weight="700" fill="#0F766E" text-anchor="middle">M</text>
      </g>
    </g>
  </g>

  <!-- Centered Content Column (max-w-2xl equivalent ~600px) -->
  <g transform="translate(100, 90)">

    <!-- 1. Rhythm & Streak Banner -->
    <g transform="translate(0, 0)">
      <rect width="600" height="76" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <g transform="translate(20, 16)">
        <!-- Amber rhythm flame icon -->
        <rect width="44" height="44" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
        <path d="M 22 10 C 22 10 28 17 28 22 C 28 26 25 30 22 30 C 19 30 16 26 16 22 C 16 17 22 10 22 10 Z" fill="#D97706" />
        <circle cx="22" cy="24" r="3" fill="#FBBF24" />
      </g>
      <text x="78" y="32" class="text-base">14-Day Consistency Cadence</text>
      <text x="78" y="50" class="text-muted">4 of 6 activities completed today. Planned rest observed on Sunday.</text>
      <!-- Rhythm Pill -->
      <rect x="500" y="24" width="76" height="28" rx="14" fill="#CCFBF1" />
      <text x="538" y="42" class="text-xs" font-weight="700" fill="#0F766E" text-anchor="middle">67% Done</text>
    </g>

    <!-- 2. Today's Period: Flexible / Daytime -->
    <g transform="translate(0, 96)">
      <text x="4" y="0" class="period-title">Flexible Cadence (Anytime)</text>

      <!-- Activity 1: Workbook Card -->
      <g transform="translate(0, 12)">
        <rect width="600" height="110" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <!-- Category Pill & Icon -->
        <g transform="translate(18, 16)">
          <rect width="118" height="22" rx="11" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1" />
          <text x="59" y="15" class="text-xs" font-weight="700" fill="#1D4ED8" text-anchor="middle">English Learning</text>
        </g>
        <text x="146" y="31" class="text-muted" font-size="11">Word Power Made Easy • Norman Lewis</text>
        
        <text x="18" y="60" class="text-base" font-size="15">Practice English Workbook</text>
        <text x="18" y="78" class="text-muted">Target: 2 sessions daily. Complete previous work revision first.</text>

        <!-- Progress Pills & Checkboxes -->
        <g transform="translate(18, 88)">
          <rect width="88" height="22" rx="6" fill="#D1FAE5" />
          <text x="44" y="15" class="text-xs" font-weight="700" fill="#059669" text-anchor="middle">Session 1 ✓</text>

          <rect x="96" y="0" width="88" height="22" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
          <text x="140" y="15" class="text-xs" font-weight="600" fill="#64748B" text-anchor="middle">Session 2 ○</text>

          <text x="200" y="15" class="text-xs" fill="#059669" font-weight="600">Revision verified ✓</text>
        </g>

        <!-- Active Check Trigger Button -->
        <rect x="520" y="38" width="60" height="34" rx="10" fill="#0F766E" />
        <text x="550" y="59" class="text-xs" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Log</text>
      </g>

      <!-- Activity 2: Listen to Osho Card -->
      <g transform="translate(0, 134)">
        <rect width="600" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <g transform="translate(18, 16)">
          <rect width="134" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
          <text x="67" y="15" class="text-xs" font-weight="700" fill="#B45309" text-anchor="middle">Listening &amp; Awareness</text>
        </g>
        <text x="162" y="31" class="text-muted" font-size="11">Group 1: Overcoming Fear and Anxiety</text>
        
        <text x="18" y="58" class="text-base" font-size="15">Main Mrityu Sikhata Hun</text>
        <text x="18" y="76" class="text-muted">Discourse series in Hindi • 15 talks archive</text>

        <!-- Status Tag -->
        <rect x="420" y="34" width="76" height="28" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <text x="458" y="52" class="text-xs" font-weight="600" fill="#64748B" text-anchor="middle">Library ↗</text>

        <!-- Checkmark Trigger -->
        <circle cx="550" cy="48" r="16" fill="#059669" />
        <path d="M 544 48 L 548 52 L 556 44" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
      </g>

      <!-- Activity 3: Speaking Practice -->
      <g transform="translate(0, 242)">
        <rect width="600" height="80" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <g transform="translate(18, 16)">
          <rect width="100" height="22" rx="11" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
          <text x="50" y="15" class="text-xs" font-weight="700" fill="#0284C7" text-anchor="middle">Communication</text>
        </g>
        <text x="18" y="56" class="text-base" font-size="15">Practice English Speaking</text>
        <text x="190" y="56" class="text-muted">Spoken dialogue with ChatGPT • Completed</text>

        <!-- Completed Check -->
        <circle cx="550" cy="40" r="16" fill="#059669" />
        <path d="M 544 40 L 548 44 L 556 36" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
      </g>
    </g>

    <!-- 3. Afternoon Period: Movement Plan -->
    <g transform="translate(0, 442)">
      <text x="4" y="0" class="period-title">Afternoon Cadence (Movement &amp; Strength)</text>
      
      <!-- Movement Card (Expanded View) -->
      <g transform="translate(0, 12)">
        <rect width="600" height="180" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" />
        <!-- Category Pill & Preferred Time -->
        <g transform="translate(18, 16)">
          <rect width="138" height="22" rx="11" fill="#CCFBF1" stroke="#99F6E4" stroke-width="1" />
          <text x="69" y="15" class="text-xs" font-weight="700" fill="#0F766E" text-anchor="middle">Movement &amp; Strength</text>
        </g>
        <text x="166" y="31" class="text-muted" font-size="11">Week 2 of 12 • Wednesday: Strength &amp; Posture</text>

        <text x="18" y="60" class="text-base" font-size="16">12-Week Body Restoration Protocol</text>
        <text x="18" y="78" class="text-muted">Target: ~30 minutes. Warm-up (5 min), Main sets (20 min), Cool-down (5 min).</text>

        <!-- Exercises checklist preview -->
        <g transform="translate(18, 92)">
          <rect width="564" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="16" y="24" class="text-xs" font-weight="700" fill="#0F172A">1. Sit-to-Stand: <tspan font-weight="500" fill="#64748B">2 sets × 8–12 reps (1m rest)</tspan></text>
          <text x="16" y="44" class="text-xs" font-weight="700" fill="#0F172A">2. Incline Push-Up: <tspan font-weight="500" fill="#64748B">2 sets × 6–10 reps</tspan></text>
          <text x="280" y="24" class="text-xs" font-weight="700" fill="#0F172A">3. Glute Bridge: <tspan font-weight="500" fill="#64748B">2 sets × 10–12 reps</tspan></text>
          <text x="280" y="44" class="text-xs" font-weight="700" fill="#0F172A">4. Cool-down: <tspan font-weight="500" fill="#64748B">Chest, Hip Flexor, Child's Pose</tspan></text>
        </g>
      </g>
    </g>

    <!-- 4. Before Bed Period: Reading & Reflection -->
    <g transform="translate(0, 656)">
      <text x="4" y="0" class="period-title">Before Bed Cadence</text>

      <!-- Reading Card -->
      <g transform="translate(0, 12)">
        <rect width="600" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <g transform="translate(18, 16)">
          <rect width="90" height="22" rx="11" fill="#EEF2FF" stroke="#E0E7FF" stroke-width="1" />
          <text x="45" y="15" class="text-xs" font-weight="700" fill="#4338CA" text-anchor="middle">Night Reading</text>
        </g>
        <text x="18" y="58" class="text-base" font-size="15">Read Books (30 Minutes)</text>
        <text x="180" y="58" class="text-muted">Unwind before sleep • No screens</text>

        <!-- Timer / Mark Button -->
        <rect x="510" y="28" width="70" height="32" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <text x="545" y="48" class="text-xs" font-weight="700" fill="#0F172A" text-anchor="middle">Start ⏱</text>
      </g>

      <!-- Diary Card -->
      <g transform="translate(0, 110)">
        <rect width="600" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <g transform="translate(18, 16)">
          <rect width="108" height="22" rx="11" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1" />
          <text x="54" y="15" class="text-xs" font-weight="700" fill="#BE123C" text-anchor="middle">Private Diary</text>
        </g>
        <text x="18" y="58" class="text-base" font-size="15">Maintain Reflective Diary</text>
        <text x="186" y="58" class="text-muted">Record insights, feelings, and assumptions • Private</text>

        <!-- Write Entry Button -->
        <rect x="500" y="28" width="80" height="32" rx="8" fill="#0F766E" />
        <text x="540" y="48" class="text-xs" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reflect ✍</text>
      </g>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Fixed 64px) -->
  <g transform="translate(0, 1036)">
    <rect width="800" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(250, 12)">
      <!-- Tab 1: Today (Active) -->
      <rect x="0" y="0" width="80" height="40" rx="12" fill="#CCFBF1" />
      <text x="40" y="25" class="text-xs" font-weight="700" fill="#0F766E" text-anchor="middle">Today</text>

      <!-- Tab 2: Routine -->
      <text x="150" y="25" class="text-xs" font-weight="600" fill="#64748B" text-anchor="middle">Routine</text>

      <!-- Tab 3: Insights -->
      <text x="260" y="25" class="text-xs" font-weight="600" fill="#64748B" text-anchor="middle">Insights</text>
    </g>
  </g>
</svg>
