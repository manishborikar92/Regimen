<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%" fill="none" role="img" aria-label="Mockup: Insights &amp; Analytics Screen">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 19px; fill: #0F172A; }
      .stat-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #0F172A; }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #64748B; text-transform: uppercase; letter-spacing: 0.05em; }
      .cal-day-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #64748B; text-anchor: middle; }
    </style>
  </defs>

  <rect width="800" height="850" fill="#F8FAFC" />

  <!-- Top Navigation -->
  <g transform="translate(0, 0)">
    <rect width="800" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <g transform="translate(0, 4) scale(0.22)">
        <path d="M 68 132 C 44 132 40 100 68 84 C 92 70 108 130 132 116 C 160 100 156 68 132 68 C 108 68 92 128 68 132 Z" stroke="#0F766E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="100" cy="100" r="11" fill="#D97706" />
      </g>
      <text x="46" y="22" class="header-title">Consistency Patterns</text>
      <text x="46" y="36" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748B">30-Day Calendar &amp; Activity Rhythm</text>
    </g>
  </g>

  <!-- Main Content Column -->
  <g transform="translate(100, 96)">

    <!-- Top 3 Stat Tiles -->
    <g transform="translate(0, 0)">
      <!-- Tile 1 -->
      <rect width="188" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="18" y="32" class="stat-label">Active Cadence</text>
      <text x="18" y="66" class="stat-num" fill="#0F766E">14 Days</text>
      <text x="18" y="82" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#059669">Steady rhythm</text>

      <!-- Tile 2 -->
      <g transform="translate(206, 0)">
        <rect width="188" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="18" y="32" class="stat-label">30-Day Completion</text>
        <text x="18" y="66" class="stat-num">88%</text>
        <text x="18" y="82" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748B">Excluding rest days</text>
      </g>

      <!-- Tile 3 -->
      <g transform="translate(412, 0)">
        <rect width="188" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="18" y="32" class="stat-label">Workbook Sessions</text>
        <text x="18" y="66" class="stat-num" fill="#1D4ED8">28 / 30</text>
        <text x="18" y="82" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#1D4ED8">Norman Lewis</text>
      </g>
    </g>

    <!-- 30-Day Calendar Heatmap -->
    <g transform="translate(0, 116)">
      <rect width="600" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="24" y="36" font-family="-apple-system, sans-serif" font-weight="800" font-size="15" fill="#0F172A">30-Day Rhythm Heatmap</text>
      <text x="24" y="54" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748B">Planned rest on Sunday is marked as recovery, never as a missed activity.</text>

      <!-- Days of Week Header (Mon - Sun) -->
      <g transform="translate(40, 80)">
        <text x="30" y="0" class="cal-day-label">Mon</text>
        <text x="100" y="0" class="cal-day-label">Tue</text>
        <text x="170" y="0" class="cal-day-label">Wed</text>
        <text x="240" y="0" class="cal-day-label">Thu</text>
        <text x="310" y="0" class="cal-day-label">Fri</text>
        <text x="380" y="0" class="cal-day-label">Sat</text>
        <text x="450" y="0" class="cal-day-label" fill="#7C3AED">Sun (Rest)</text>
      </g>

      <!-- Calendar Matrix Simulation -->
      <g transform="translate(40, 96)">
        <!-- Row 1 -->
        <rect x="10" y="8" width="40" height="34" rx="8" fill="#0F766E" /><text x="30" y="30" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="80" y="8" width="40" height="34" rx="8" fill="#0F766E" /><text x="100" y="30" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="150" y="8" width="40" height="34" rx="8" fill="#0D9488" /><text x="170" y="30" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">83%</text>
        <rect x="220" y="8" width="40" height="34" rx="8" fill="#0F766E" /><text x="240" y="30" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="290" y="8" width="40" height="34" rx="8" fill="#14B8A6" /><text x="310" y="30" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">67%</text>
        <rect x="360" y="8" width="40" height="34" rx="8" fill="#0F766E" /><text x="380" y="30" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="430" y="8" width="40" height="34" rx="8" fill="#EDE9FE" stroke="#DDD6FE" /><text x="450" y="30" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">Rest</text>

        <!-- Row 2 -->
        <rect x="10" y="50" width="40" height="34" rx="8" fill="#0F766E" /><text x="30" y="72" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="80" y="50" width="40" height="34" rx="8" fill="#0F766E" /><text x="100" y="72" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="150" y="50" width="40" height="34" rx="8" fill="#0F766E" /><text x="170" y="72" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="220" y="50" width="40" height="34" rx="8" fill="#0D9488" /><text x="240" y="72" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">83%</text>
        <rect x="290" y="50" width="40" height="34" rx="8" fill="#0F766E" /><text x="310" y="72" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="360" y="50" width="40" height="34" rx="8" fill="#14B8A6" /><text x="380" y="72" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">67%</text>
        <rect x="430" y="50" width="40" height="34" rx="8" fill="#EDE9FE" stroke="#DDD6FE" /><text x="450" y="72" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">Rest</text>

        <!-- Row 3 (Today's week) -->
        <rect x="10" y="92" width="40" height="34" rx="8" fill="#0F766E" /><text x="30" y="114" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <rect x="80" y="92" width="40" height="34" rx="8" fill="#0F766E" /><text x="100" y="114" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">100%</text>
        <!-- Today Wednesday active -->
        <rect x="150" y="92" width="40" height="34" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" /><text x="170" y="114" font-size="11" font-weight="800" fill="#0F766E" text-anchor="middle">67%*</text>
        <rect x="220" y="92" width="40" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" /><text x="240" y="114" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Thu</text>
        <rect x="290" y="92" width="40" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" /><text x="310" y="114" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Fri</text>
        <rect x="360" y="92" width="40" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" /><text x="380" y="114" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Sat</text>
        <rect x="430" y="92" width="40" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" /><text x="450" y="114" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Sun</text>
      </g>
    </g>

    <!-- Pillar Breakdown Cards -->
    <g transform="translate(0, 416)">
      <!-- Left Pillar -->
      <rect width="290" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="18" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#0F172A">Movement Progression</text>
      <text x="18" y="48" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748B">12-Week Protocol • Week 2</text>
      <text x="18" y="80" class="stat-num" fill="#0F766E">6 of 6</text>
      <text x="18" y="100" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#059669">Workouts &amp; walks completed as scheduled</text>
      <text x="18" y="126" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#475569">Next medical check-up check: Week 4</text>

      <!-- Right Pillar -->
      <g transform="translate(310, 0)">
        <rect width="290" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="18" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#0F172A">Mindful Contemplation</text>
        <text x="18" y="48" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748B">Osho Talks, Reading &amp; Diary</text>
        <text x="18" y="80" class="stat-num" fill="#B45309">48 Sessions</text>
        <text x="18" y="100" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748B">Active series: Main Mrityu Sikhata Hun</text>
        <text x="18" y="126" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#475569">Average night reading: 32 minutes</text>
      </g>
    </g>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 786)">
    <rect width="800" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(250, 12)">
      <text x="40" y="25" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B" text-anchor="middle">Today</text>
      <text x="150" y="25" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B" text-anchor="middle">Routine</text>
      
      <!-- Insights Active -->
      <rect x="220" y="0" width="80" height="40" rx="12" fill="#CCFBF1" />
      <text x="260" y="25" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#0F766E" text-anchor="middle">Insights</text>
    </g>
  </g>
</svg>
