      <rect x="14" y="98" width="76" height="22" rx="6" fill="#D1FAE5" />
      <text x="52" y="113" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" fill="#059669" text-anchor="middle">Session 1 ✓</text>

      <rect x="96" y="98" width="76" height="22" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="134" y="113" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" fill="#64748B" text-anchor="middle">Session 2 ○</text>

      <circle cx="296" cy="72" r="16" fill="#0F766E" />
      <text x="296" y="77" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">+</text>
