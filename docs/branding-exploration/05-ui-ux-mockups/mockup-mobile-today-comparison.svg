      <text x="296" y="60" font-size="12" text-anchor="middle">⏱</text>
    </g>

    <!-- Mobile BottomNav (Fixed Thumb Reach) -->
    <g transform="translate(6, 672)">
      <rect width="368" height="62" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <g transform="translate(30, 8)">
