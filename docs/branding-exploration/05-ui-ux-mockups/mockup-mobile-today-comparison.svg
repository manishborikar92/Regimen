      <rect x="14" y="30" width="94" height="20" rx="10" fill="#EFF6FF" />
      <text x="61" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" fill="#1D4ED8" text-anchor="middle">English Learning</text>

      <text x="14" y="72" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#0F172A">Practice English Workbook</text>
      <text x="14" y="88" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748B">Word Power Made Easy • Norman Lewis</text>

