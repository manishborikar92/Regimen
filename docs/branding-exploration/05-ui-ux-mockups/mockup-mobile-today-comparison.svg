<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="100%" height="100%" fill="none" role="img" aria-label="Mockup: Mobile Today Experience Comparison (Light vs Dark)">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .sheet-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #0F172A; }
      .sheet-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #64748B; }
      .phone-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
  </defs>

  <rect width="960" height="900" fill="#E2E8F0" />

  <!-- Sheet Header -->
  <g transform="translate(60, 36)">
    <text x="0" y="20" class="sheet-title">Mobile-First Touch Architecture (Light &amp; Dark Viewports)</text>
    <text x="0" y="42" class="sheet-sub">Designed for one-thumb reachability, generous 48px touch targets, zero-glare night reading, and clear period grouping.</text>
  </g>

  <!-- ==========================================
       LEFT: MOBILE LIGHT VIEWPORT (380 × 740)
       ========================================== -->
  <g transform="translate(60, 100)">
    <text x="0" y="-12" class="phone-label" fill="#0F766E">Mobile Light Mode (Daylight Study)</text>
    <!-- Device Frame -->
    <rect width="380" height="740" rx="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="6" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="135" y="10" width="110" height="24" rx="12" fill="#0F172A" />

    <!-- Screen Canvas -->
    <rect x="6" y="6" width="368" height="728" rx="30" fill="#F8FAFC" />

    <!-- Mobile TopNav (Compact) -->
    <g transform="translate(24, 46)">
      <!-- Approved Logo: Guiding Sutra -->
      <g transform="translate(0, 2) scale(0.18)">
        <path d="M 68 132 C 44 132 40 100 68 84 C 92 70 108 130 132 116 C 160 100 156 68 132 68 C 108 68 92 128 68 132 Z" stroke="#0F766E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="100" cy="100" r="12" fill="#D97706" />
      </g>
      <text x="36" y="18" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#0F172A">VRITTA</text>
      <text x="36" y="32" font-family="-apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748B">Wed, Oct 14 • Today</text>

      <!-- Theme Switch Icon -->
      <circle cx="280" cy="16" r="14" fill="#F1F5F9" />
      <path d="M 276 13 A 5 5 0 0 0 281 18 A 5 5 0 1 1 276 13" fill="#0F766E" />
      <!-- Avatar -->
      <circle cx="316" cy="16" r="14" fill="#CCFBF1" />
      <text x="316" y="20" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#0F766E" text-anchor="middle">M</text>
    </g>

    <!-- Mobile Streak Bar -->
    <g transform="translate(24, 98)">
      <rect width="332" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="14" y="12" width="40" height="40" rx="10" fill="#FEF3C7" />
      <text x="34" y="37" font-size="18" text-anchor="middle">🔥</text>
      <text x="64" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#0F172A">14-Day Consistency</text>
      <text x="64" y="44" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748B">4 of 6 completed today</text>
      <rect x="256" y="18" width="62" height="26" rx="13" fill="#CCFBF1" />
      <text x="287" y="35" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#0F766E" text-anchor="middle">67%</text>
    </g>

    <!-- Mobile Card 1: English Workbook -->
    <g transform="translate(24, 172)">
      <text x="2" y="10" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B" letter-spacing="0.06em">FLEXIBLE CADENCE</text>
      
