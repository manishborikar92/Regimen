        <rect x="0" y="0" width="70" height="38" rx="10" fill="#CCFBF1" />
        <text x="35" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#0F766E" text-anchor="middle">Today</text>
        
        <!-- Tab 2: Routine -->
        <text x="155" y="24" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B" text-anchor="middle">Routine</text>

        <!-- Tab 3: Insights -->
