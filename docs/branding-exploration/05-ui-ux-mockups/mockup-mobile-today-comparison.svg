      <text x="24" y="132" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" fill="#0F172A">✓ Incline Push-Up (2 sets × 8)</text>
      <text x="24" y="146" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" fill="#64748B">○ Glute Bridge &amp; Cool-down</text>
    </g>

    <!-- Mobile Card 3: Bedtime Reading -->
