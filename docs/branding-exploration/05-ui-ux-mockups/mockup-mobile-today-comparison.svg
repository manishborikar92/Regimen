      <rect x="14" y="30" width="118" height="20" rx="10" fill="#CCFBF1" />
      <text x="73" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" fill="#0F766E" text-anchor="middle">Movement &amp; Strength</text>

      <text x="14" y="72" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#0F172A">Body Restoration Protocol</text>
      <text x="14" y="88" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748B">Week 2 • Wednesday Workout (~30m)</text>

