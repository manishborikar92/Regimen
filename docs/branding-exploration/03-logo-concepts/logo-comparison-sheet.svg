<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" fill="none" role="img" aria-label="Brand Logo Concepts Comparison Sheet">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 14px; fill: #64748B; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; fill: #475569; }
      .concept-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #0F172A; text-anchor: middle; }
      .concept-title-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #F8FAFC; text-anchor: middle; }
      .concept-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #64748B; text-anchor: middle; }
      .concept-desc-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #94A3B8; text-anchor: middle; }
      .wordmark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.22em; fill: #0F172A; }
      .wordmark-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.22em; fill: #F8FAFC; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="960" fill="#F1F5F9" />

  <!-- Sheet Header -->
  <g transform="translate(60, 48)">
    <text x="0" y="24" class="title">Brand Identity Exploration: Five Distinct Logo Marks</text>
    <text x="0" y="48" class="subtitle">Evaluated across Light mode, Dark mode, micro-scales (32px / 16px), and wordmark lockups. Pure geometry, zero AI-gradient cliché.</text>
  </g>

  <!-- ==========================================
       ROW 1: LIGHT MODE EXPLORATION
       ========================================== -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" class="section-label">Light Theme Showcase (Canvas: #F8FAFC)</text>

    <!-- Concept 1 Card (Light) -->
    <g transform="translate(0, 16)">
      <rect width="200" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Concept 1 Mark -->
      <g transform="translate(40, 24) scale(0.6)">
        <path d="M 140 60 A 56 56 0 1 0 140 140" stroke="#0F766E" stroke-width="15" stroke-linecap="round" fill="none" />
        <path d="M 124 76 A 34 34 0 1 0 124 124" stroke="#0D9488" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4" />
        <circle cx="140" cy="100" r="10" fill="#D97706" />
      </g>
      <text x="100" y="172" class="concept-title">1. The Open Cadence</text>
      <text x="100" y="192" class="concept-desc">Grounded Arc &amp; Anchor</text>
      <text x="100" y="210" class="concept-desc" font-size="10" fill="#0F766E">Breathable, non-punitive</text>
    </g>

    <!-- Concept 2 Card (Light) -->
    <g transform="translate(220, 16)">
      <rect width="200" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Concept 2 Mark -->
      <g transform="translate(40, 24) scale(0.6)">
        <rect x="44" y="130" width="112" height="18" rx="9" fill="#334155" />
        <rect x="62" y="96" width="84" height="18" rx="9" fill="#0F766E" />
        <rect x="80" y="62" width="56" height="18" rx="9" fill="#14B8A6" />
        <circle cx="146" cy="71" r="7" fill="#D97706" />
      </g>
      <text x="100" y="172" class="concept-title">2. Stepped Horizon</text>
      <text x="100" y="192" class="concept-desc">Krama Terraces</text>
      <text x="100" y="210" class="concept-desc" font-size="10" fill="#0F766E">12-week progression</text>
    </g>

    <!-- Concept 3 Card (Light) -->
    <g transform="translate(440, 16)">
      <rect width="200" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Concept 3 Mark -->
      <g transform="translate(40, 24) scale(0.6)">
        <path d="M 68 132 C 44 132 40 100 68 84 C 92 70 108 130 132 116 C 160 100 156 68 132 68 C 108 68 92 128 68 132 Z" stroke="#0F766E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="100" cy="100" r="9" fill="#D97706" />
      </g>
      <text x="100" y="172" class="concept-title">3. Guiding Sutra</text>
      <text x="100" y="192" class="concept-desc">Continuous Ribbon Loop</text>
      <text x="100" y="210" class="concept-desc" font-size="10" fill="#0F766E">Connected practices</text>
    </g>

    <!-- Concept 4 Card (Light) -->
    <g transform="translate(660, 16)">
      <rect width="200" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Concept 4 Mark -->
      <g transform="translate(40, 24) scale(0.6)">
        <path d="M 100 42 A 58 58 0 1 0 158 100 A 42 42 0 1 1 100 42 Z" fill="#0F766E" />
        <circle cx="116" cy="88" r="14" fill="#D97706" />
        <circle cx="100" cy="100" r="68" stroke="#0D9488" stroke-width="3" stroke-dasharray="6 8" opacity="0.4" fill="none" />
      </g>
      <text x="100" y="172" class="concept-title">4. The Still Center</text>
      <text x="100" y="192" class="concept-desc">Contemplative Disc</text>
      <text x="100" y="210" class="concept-desc" font-size="10" fill="#0F766E">Mindfulness &amp; focus</text>
    </g>

    <!-- Concept 5 Card (Light) -->
    <g transform="translate(880, 16)">
      <rect width="200" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Concept 5 Mark -->
      <g transform="translate(40, 24) scale(0.6)">
        <rect x="66" y="46" width="28" height="108" rx="14" fill="#0F766E" />
        <rect x="106" y="80" width="28" height="74" rx="14" fill="#D97706" />
        <circle cx="120" cy="54" r="8" fill="#0D9488" />
      </g>
      <text x="100" y="172" class="concept-title">5. The Dual Pulse</text>
      <text x="100" y="192" class="concept-desc">Action &amp; Recovery Pillars</text>
      <text x="100" y="210" class="concept-desc" font-size="10" fill="#0F766E">Rest is integral</text>
    </g>
  </g>

  <!-- ==========================================
       ROW 2: DARK THEME SHOWCASE
       ========================================== -->
  <g transform="translate(60, 420)">
    <text x="0" y="0" class="section-label">Dark Theme Showcase (Canvas: #090D16 — True Mineral Dark)</text>

    <!-- Concept 1 Card (Dark) -->
    <g transform="translate(0, 16)">
      <rect width="200" height="230" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
      <g transform="translate(40, 24) scale(0.6)">
        <path d="M 140 60 A 56 56 0 1 0 140 140" stroke="#2DD4BF" stroke-width="15" stroke-linecap="round" fill="none" />
        <path d="M 124 76 A 34 34 0 1 0 124 124" stroke="#14B8A6" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4" />
        <circle cx="140" cy="100" r="10" fill="#F59E0B" />
      </g>
      <text x="100" y="172" class="concept-title-dark">1. The Open Cadence</text>
      <text x="100" y="192" class="concept-desc-dark">Grounded Arc &amp; Anchor</text>
      <text x="100" y="210" class="concept-desc-dark" font-size="10" fill="#2DD4BF">High contrast, quiet</text>
    </g>

    <!-- Concept 2 Card (Dark) -->
    <g transform="translate(220, 16)">
      <rect width="200" height="230" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
      <g transform="translate(40, 24) scale(0.6)">
        <rect x="44" y="130" width="112" height="18" rx="9" fill="#475569" />
        <rect x="62" y="96" width="84" height="18" rx="9" fill="#14B8A6" />
        <rect x="80" y="62" width="56" height="18" rx="9" fill="#2DD4BF" />
        <circle cx="146" cy="71" r="7" fill="#F59E0B" />
      </g>
      <text x="100" y="172" class="concept-title-dark">2. Stepped Horizon</text>
      <text x="100" y="192" class="concept-desc-dark">Krama Terraces</text>
      <text x="100" y="210" class="concept-desc-dark" font-size="10" fill="#2DD4BF">Architectural clarity</text>
    </g>

    <!-- Concept 3 Card (Dark) -->
    <g transform="translate(440, 16)">
      <rect width="200" height="230" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
      <g transform="translate(40, 24) scale(0.6)">
        <path d="M 68 132 C 44 132 40 100 68 84 C 92 70 108 130 132 116 C 160 100 156 68 132 68 C 108 68 92 128 68 132 Z" stroke="#2DD4BF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="100" cy="100" r="9" fill="#F59E0B" />
      </g>
      <text x="100" y="172" class="concept-title-dark">3. Guiding Sutra</text>
      <text x="100" y="192" class="concept-desc-dark">Continuous Ribbon</text>
      <text x="100" y="210" class="concept-desc-dark" font-size="10" fill="#2DD4BF">Luminous fluid stroke</text>
    </g>

    <!-- Concept 4 Card (Dark) -->
    <g transform="translate(660, 16)">
      <rect width="200" height="230" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
      <g transform="translate(40, 24) scale(0.6)">
        <path d="M 100 42 A 58 58 0 1 0 158 100 A 42 42 0 1 1 100 42 Z" fill="#2DD4BF" />
        <circle cx="116" cy="88" r="14" fill="#F59E0B" />
        <circle cx="100" cy="100" r="68" stroke="#14B8A6" stroke-width="3" stroke-dasharray="6 8" opacity="0.4" fill="none" />
      </g>
      <text x="100" y="172" class="concept-title-dark">4. The Still Center</text>
      <text x="100" y="192" class="concept-desc-dark">Aperture Disc</text>
      <text x="100" y="210" class="concept-desc-dark" font-size="10" fill="#2DD4BF">Solid icon silhouetted</text>
    </g>

    <!-- Concept 5 Card (Dark) -->
    <g transform="translate(880, 16)">
      <rect width="200" height="230" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
      <g transform="translate(40, 24) scale(0.6)">
        <rect x="66" y="46" width="28" height="108" rx="14" fill="#2DD4BF" />
        <rect x="106" y="80" width="28" height="74" rx="14" fill="#F59E0B" />
        <circle cx="120" cy="54" r="8" fill="#14B8A6" />
      </g>
      <text x="100" y="172" class="concept-title-dark">5. The Dual Pulse</text>
      <text x="100" y="192" class="concept-desc-dark">Action &amp; Recovery</text>
      <text x="100" y="210" class="concept-desc-dark" font-size="10" fill="#2DD4BF">Balanced dual pillar</text>
    </g>
  </g>

  <!-- ==========================================
       ROW 3: SCALABILITY & WORDMARK LOCKUP (RECOMMENDED CONCEPT 1 & 2)
       ========================================== -->
  <g transform="translate(60, 710)">
    <text x="0" y="0" class="section-label">Micro-Scalability (Favicon 32px / 16px) &amp; Typographic Wordmark</text>

    <!-- Light Lockup: Concept 1 with KRAMA -->
    <g transform="translate(0, 18)">
      <rect width="520" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Small Mark -->
      <g transform="translate(24, 28) scale(0.5)">
        <path d="M 140 60 A 56 56 0 1 0 140 140" stroke="#0F766E" stroke-width="15" stroke-linecap="round" fill="none" />
        <circle cx="140" cy="100" r="10" fill="#D97706" />
      </g>
      <!-- Wordmark text -->
      <text x="130" y="72" class="wordmark">KRAMA</text>
      <text x="130" y="94" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="0.04em">Personal Routine Companion</text>
      
      <!-- Favicon simulation box -->
      <g transform="translate(400, 32)">
        <text x="0" y="-8" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">32px Favicon</text>
        <rect width="36" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" />
        <g transform="translate(2, 2) scale(0.16)">
          <path d="M 140 60 A 56 56 0 1 0 140 140" stroke="#0F766E" stroke-width="20" stroke-linecap="round" fill="none" />
          <circle cx="140" cy="100" r="14" fill="#D97706" />
        </g>
      </g>

      <g transform="translate(460, 32)">
        <text x="0" y="-8" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">16px Tab</text>
        <rect width="24" height="24" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
        <g transform="translate(0, 0) scale(0.12)">
          <path d="M 140 60 A 56 56 0 1 0 140 140" stroke="#0F766E" stroke-width="24" stroke-linecap="round" fill="none" />
          <circle cx="140" cy="100" r="18" fill="#D97706" />
        </g>
      </g>
    </g>

    <!-- Dark Lockup: Concept 2 with KRAMA -->
    <g transform="translate(560, 18)">
      <rect width="520" height="160" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
      <!-- Small Mark -->
      <g transform="translate(24, 28) scale(0.5)">
        <rect x="44" y="130" width="112" height="18" rx="9" fill="#475569" />
        <rect x="62" y="96" width="84" height="18" rx="9" fill="#14B8A6" />
        <rect x="80" y="62" width="56" height="18" rx="9" fill="#2DD4BF" />
        <circle cx="146" cy="71" r="7" fill="#F59E0B" />
      </g>
      <!-- Wordmark text -->
      <text x="130" y="72" class="wordmark-dark">KRAMA</text>
      <text x="130" y="94" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="0.04em">Personal Routine Companion</text>

      <!-- Favicon simulation box -->
      <g transform="translate(400, 32)">
        <text x="0" y="-8" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B">32px Dark</text>
        <rect width="36" height="36" rx="8" fill="#090D16" stroke="#334155" />
        <g transform="translate(2, 2) scale(0.16)">
          <rect x="44" y="130" width="112" height="24" rx="12" fill="#64748B" />
          <rect x="62" y="96" width="84" height="24" rx="12" fill="#14B8A6" />
          <rect x="80" y="62" width="56" height="24" rx="12" fill="#2DD4BF" />
        </g>
      </g>

      <g transform="translate(460, 32)">
        <text x="0" y="-8" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B">16px Dark</text>
        <rect width="24" height="24" rx="6" fill="#090D16" stroke="#334155" />
        <g transform="translate(0, 0) scale(0.12)">
          <rect x="44" y="130" width="112" height="28" rx="14" fill="#64748B" />
          <rect x="62" y="96" width="84" height="28" rx="14" fill="#14B8A6" />
          <rect x="80" y="62" width="56" height="28" rx="14" fill="#2DD4BF" />
        </g>
      </g>
    </g>
  </g>
</svg>
