<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="Logo Concept 5: The Dual Pulse">
  <desc>Concept 5 — The Dual Pulse. Harmonic dual pillars representing the sacred rhythm between Action and Recovery.</desc>
  <rect width="200" height="200" rx="36" fill="#F8FAFC" />
  
  <!-- Pillar 1: Action, Movement & Study (Ascending Dynamic Capsule) -->
  <rect
    x="66"
    y="46"
    width="28"
    height="108"
    rx="14"
    fill="#0F766E"
  />

  <!-- Pillar 2: Recovery, Rest & Contemplation (Grounded Harmonic Capsule) -->
  <rect
    x="106"
    y="80"
    width="28"
    height="74"
    rx="14"
    fill="#D97706"
  />

  <!-- Harmonic Focus Satellite Dot -->
  <circle
    cx="120"
    cy="54"
    r="8"
    fill="#0D9488"
  />
</svg>
