<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="Logo Concept 1: The Open Cadence">
  <desc>Concept 1 — Grounded Arc and Anchor. A breathable 270-degree rhythmic arc with an anchor focal seed.</desc>
  <!-- Background Container for Light/Dark Context (Optional transparent) -->
  <rect width="200" height="200" rx="36" fill="#F8FAFC" class="canvas-bg" />
  
  <!-- Outer Open Rhythmic Arc (Breathable, Non-Punitive Cycle) -->
  <path
    d="M 140 60 A 56 56 0 1 0 140 140"
    stroke="#0F766E"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Subtle Harmonic Inner Cadence Accent -->
  <path
    d="M 124 76 A 34 34 0 1 0 124 124"
    stroke="#0D9488"
    stroke-width="8"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Central Anchor Seed / Presence Dot -->
  <circle
    cx="140"
    cy="100"
    r="10"
    fill="#D97706"
  />
</svg>
