<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="Logo Concept 2: The Stepped Horizon">
  <desc>Concept 2 — The Stepped Horizon / Krama Terraces. Three ascending geometric tiers representing progressive growth and structured mastery.</desc>
  <rect width="200" height="200" rx="36" fill="#F8FAFC" />
  
  <!-- Tier 1: Foundation (Broad, Grounded) -->
  <rect
    x="44"
    y="130"
    width="112"
    height="18"
    rx="9"
    fill="#334155"
  />

  <!-- Tier 2: Momentum & Practice (Intermediate Offset Tier) -->
  <rect
    x="62"
    y="96"
    width="84"
    height="18"
    rx="9"
    fill="#0F766E"
  />

  <!-- Tier 3: Growth & Mastery (Ascendant Pinnacle Tier) -->
  <rect
    x="80"
    y="62"
    width="56"
    height="18"
    rx="9"
    fill="#14B8A6"
  />

  <!-- Optional Subtle Vertical Harmonic Axis -->
  <circle
    cx="146"
    cy="71"
    r="7"
    fill="#D97706"
  />
</svg>
