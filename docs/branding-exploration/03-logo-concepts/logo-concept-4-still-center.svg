<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="Logo Concept 4: The Still Center">
  <desc>Concept 4 — The Still Center / Contemplative Aperture. Bold geometric disc with negative space crescent and calm focal point.</desc>
  <rect width="200" height="200" rx="36" fill="#F8FAFC" />
  
  <mask id="crescentMask">
    <rect width="200" height="200" fill="white" />
    <!-- Negative space carving circle -->
    <circle cx="120" cy="88" r="42" fill="black" />
  </mask>

  <!-- Primary Contemplative Disc -->
  <circle
    cx="100"
    cy="100"
    r="58"
    fill="#0F766E"
    mask="url(#crescentMask)"
  />

  <!-- The Still Inner Center Nucleus (Warm Golden Amber) -->
  <circle
    cx="116"
    cy="88"
    r="14"
    fill="#D97706"
  />

  <!-- Subtle Outer Resonance Ring -->
  <circle
    cx="100"
    cy="100"
    r="68"
    stroke="#0D9488"
    stroke-width="3"
    stroke-dasharray="6 8"
    opacity="0.5"
  />
</svg>
