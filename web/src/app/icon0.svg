<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="VRITTA Logo: The Guiding Sutra">
  <desc>VRITTA — The Guiding Sutra. A continuous monoline ribbon loop representing the unbroken thread connecting all daily practices.</desc>
  <rect width="200" height="200" rx="36" fill="#F8FAFC" class="vritta-bg" />

  <style>
    @media (prefers-color-scheme: dark) {
      .vritta-bg { fill: #090D16; }
      .vritta-thread { stroke: #14B8A6; }
      .vritta-dot { fill: #F59E0B; }
    }
  </style>

  <!-- Continuous Harmonious Thread Loop (Bezier Precision) -->
  <path
    class="vritta-thread"
    d="M 68 132 C 44 132 40 100 68 84 C 92 70 108 130 132 116 C 160 100 156 68 132 68 C 108 68 92 128 68 132 Z"
    stroke="#0F766E"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Balance Point -->
  <circle
    class="vritta-dot"
    cx="100"
    cy="100"
    r="8"
    fill="#D97706"
  />
</svg>
