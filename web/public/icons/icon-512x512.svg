    <path d="M0 45C0 45 -14 28 -14 16C-14 6 -6 0 0 0C6 0 14 6 14 16C14 28 0 45 0 45Z" fill="#FFF" opacity="0.85"/>
    <ellipse cx="0" cy="20" rx="6" ry="8" fill="#FFF" opacity="0.6"/>
  </g>
  
  <!-- Small Habit Dots (representing daily routine) -->
  <circle cx="140" cy="140" r="8" fill="white" opacity="0.6"/>
  <circle cx="372" cy="372" r="8" fill="white" opacity="0.6"/>
  <circle cx="140" cy="372" r="8" fill="white" opacity="0.6"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
