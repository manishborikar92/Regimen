<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient1)"/>
  
  <!-- Outer Glow Circles -->
  <circle cx="256" cy="256" r="200" fill="white" opacity="0.1"/>
  <circle cx="256" cy="256" r="180" fill="white" opacity="0.15"/>
  <circle cx="256" cy="256" r="155" fill="white" opacity="0.2"/>
  
  <!-- Main Checkmark -->
  <path d="M186 256L230 300L326 204" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Circular Progress Indicator (3/4 circle) -->
  <path d="M256 75 A181 181 0 1 1 75 256" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.4" fill="none"/>
  
  <!-- Streak Flame Icon (top right) -->
  <g transform="translate(360, 110)">
