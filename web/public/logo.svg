<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Soft subtle gradient definition -->
  <defs>
    <linearGradient id="vrittaGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="vrittaAccent" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Outer rhythmic arc (revolving cycle) -->
  <path
    d="M 24 6 A 18 18 0 1 1 9.4 14.5"
    stroke="url(#vrittaGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Inner harmonious arc -->
  <path
    d="M 24 13 A 11 11 0 1 0 32.5 17.5"
    stroke="url(#vrittaAccent)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Central calm anchor / seed -->
  <circle
    cx="24"
    cy="24"
    r="4"
    fill="#4f46e5"
  />
</svg>
